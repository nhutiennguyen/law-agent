services:
  - type: web
    name: huynh-nguyen-khang-father
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
